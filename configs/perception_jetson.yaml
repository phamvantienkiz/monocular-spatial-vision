# Configuration: Jetson AGX Xavier Perception Backend
# Defines Ingest TCP Server, Model Engine, Geometry, and ROS 2 parameters.

network:
  ingest_port: 9876
  ring_buffer_size: 5

api:
  host: "0.0.0.0"
  port: 8000

model:
  engine_path: "weights/yolov8n-seg.engine"
  onnx_path: "weights/yolov8n-seg.onnx"
  confidence_threshold: 0.50
  iou_threshold: 0.45
  target_classes: [0, 56, 60]  # COCO: 0=Person, 56=Chair, 60=Dining Table

geometry:
  calib_config_path: "configs/calib_pcam5c.yaml"
  enable_imu_tilt_compensation: true
  shadow_rejection_threshold: 15.0

ros2:
  enabled: false
  topic_objects_3d: "/perception/mono/objects_3d"
  topic_telemetry: "/perception/mono/telemetry"
  optical_frame_id: "camera_optical_frame"
